name: Invariant Frog
on:
  push:
    paths: [games/invariant/**, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, .github/workflows/invariant.yml]
  pull_request:
    paths: [games/invariant/**, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, .github/workflows/invariant.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/invariant
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm validate
      - run: pnpm build
