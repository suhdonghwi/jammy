<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invariant Frog</title>
    <meta name="description" content="An interactive game for learning loop invariants." />
    <meta name="theme-color" content="#f6f8fb" />
    <link rel="canonical" href="%SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Invariant Frog" />
    <meta property="og:title" content="Invariant Frog" />
    <meta property="og:description" content="An interactive game for learning loop invariants." />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Invariant Frog, in puffy 3D letters, over a plane of tiles where frogs hop around a ring" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐸</text></svg>" />
    <!-- z3-solver's Emscripten build expects Node's `global` -->
    <script>globalThis.global = globalThis;</script>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        pointer-events: none;
        animation: boot-in 0.4s ease-out 1s both;
      }
      #boot i {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        background: #5c9df5;
        box-shadow: 0 3px 0 #3a78d8;
        animation: boot-hop 0.9s ease-in-out infinite;
      }
      #boot i:nth-child(2) {
        animation-delay: 0.15s;
      }
      #boot i:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
        }
      }
      @keyframes boot-hop {
        0%,
        60%,
        100% {
          transform: none;
        }
        30% {
          transform: translateY(-8px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" role="status" aria-label="Loading"><i></i><i></i><i></i></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
