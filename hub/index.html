<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jammy.fun</title>
    <meta name="description" content="Small games by Suh Donghwi." />
    <meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151a24" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍓</text></svg>"
    />
    <!-- Invariant Frog's rounded type: Fredoka for headings, Nunito for the rest -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;600&display=swap"
    />
    <style>
      /* The colours follow games/invariant/src/styles.css. */
      :root {
        --wash: #f4f6fa;
        --card: #ffffff;
        --ink: #1c2333;
        --muted: #66708a;
        --line: rgb(32 44 70 / 0.09);
        --grid: rgb(32 44 70 / 0.05);
        --brand: #3b82f6;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --wash: #151a24;
          --card: #1d2430;
          --ink: #eef1f6;
          --muted: #9aa4b8;
          --line: rgb(200 212 235 / 0.1);
          --grid: rgb(200 212 235 / 0.04);
          --brand: #5b97f8;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        /* svh, not vh: on phones 100vh is the height with the browser's
           toolbars hidden, taller than the screen while they show, so the page
           scrolled though everything fits */
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 48px 16px;
        background:
          linear-gradient(var(--grid) 1px, transparent 1px) center / 44px 44px,
          linear-gradient(90deg, var(--grid) 1px, transparent 1px) center / 44px 44px,
          var(--wash);
        color: var(--ink);
        font: 16px/1.5 Nunito, ui-rounded, system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 480px;
      }
      h1 {
        margin: 0 0 10px;
        font: 600 32px/1.2 Fredoka, ui-rounded, system-ui, sans-serif;
      }
      p.lede {
        margin: 0 0 28px;
        color: var(--muted);
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 12px;
      }
      a.game {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--card);
        color: inherit;
        text-decoration: none;
      }
      a.game:hover,
      a.game:focus-visible {
        border-color: var(--brand);
        outline: none;
      }
      footer {
        margin-top: 24px;
        text-align: center;
      }
      footer a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 14px;
        text-decoration: none;
      }
      footer a:hover,
      footer a:focus-visible {
        color: var(--ink);
      }
      footer svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }
      .emoji {
        font-size: 32px;
        line-height: 1;
      }
      .name {
        font: 600 18px/1.3 Fredoka, ui-rounded, system-ui, sans-serif;
      }
      .desc {
        color: var(--muted);
        font-size: 14px;
      }
      @media (max-width: 480px) {
        body {
          padding: 24px 16px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>jammy.fun</h1>
      <p class="lede">small games, made for fun.</p>
      <ul>
        <li>
          <a class="game" href="/invariant/">
            <span class="emoji" aria-hidden="true">🐸</span>
            <span>
              <span class="name">Invariant Frog</span><br />
              <span class="desc">A puzzle game about loop invariants, checked by Z3.</span>
            </span>
          </a>
        </li>
      </ul>
      <footer>
        <a href="https://github.com/suhdonghwi/jammy">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
            />
          </svg>
          GitHub
        </a>
      </footer>
    </main>
  </body>
</html>
